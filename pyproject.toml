[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clothing_erp"
version = "1.0.0"
authors = [
    { name = "Clothing ERP Contributors", email = "team@clothing-erp.invalid" }
]
description = "Distribution ERP suite for Frappe and ERPNext: Sales ERP, Warehouse ERP, and Quality ERP"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/AviDhandhania/erp"
Repository = "https://github.com/AviDhandhania/erp"

[tool.setuptools]
package-dir = { "sales_erp" = "sales_erp/sales_erp", "warehouse_erp" = "warehouse_erp/warehouse_erp", "quality_erp" = "quality_erp/quality_erp", "clothing_erp" = "clothing_erp" }
packages = ["sales_erp", "warehouse_erp", "quality_erp", "clothing_erp"]
