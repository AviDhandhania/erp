[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "clothing_erp"
authors = [
    { name = "Clothing ERP Contributors", email = "team@clothing-erp.invalid" }
]
description = "Open-source clothing distribution ERP extension for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/AviDhandhania/erp"
Repository = "https://github.com/AviDhandhania/erp"

[tool.bench.frappe-dependencies]
frappe = ">=16.55.2,<17.0.0"
erpnext = ">=16.54.0,<17.0.0"
