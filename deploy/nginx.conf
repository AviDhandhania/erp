map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream clothing_web { server 127.0.0.1:8000; }
upstream clothing_socketio { server unix:/run/clothing-erp/socketio.sock; }
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # The lifecycle manager holds this gate until code, database and services are healthy.
    if (-f /var/lib/clothing-erp/maintenance) { return 503; }
    root /home/frappe/frappe-bench/sites;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    # File authorization (especially private files) remains in Frappe.
    location /protected/ { return 404; }
    location /socket.io {
        proxy_pass http://clothing_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Frappe-Site-Name clothing.local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://clothing_web;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name clothing.local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
