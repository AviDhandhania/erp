map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream clothing_web { server 127.0.0.1:8000; }
upstream clothing_socketio { server unix:/run/clothing-erp/socketio.sock; }

# HTTP Server: Redirect all plain HTTP traffic to HTTPS (port 443)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge support for automated Let's Encrypt / Certbot renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Unconditional redirect of all web requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: High-security TLS termination with modern ciphers and strict headers
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # TLS Certificates (Operator-supplied or self-signed initial baseline)
    ssl_certificate /etc/ssl/clothing-erp/cert.pem;
    ssl_certificate_key /etc/ssl/clothing-erp/key.pem;

    # Modern TLS Protocols and Cipher Suites (TLS 1.2 & TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ClothingSSL:10m;
    ssl_session_tickets off;

    # High-Security Response Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: /private/files/; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;

    # The lifecycle manager holds this gate until code, database and services are healthy.
    if (-f /var/lib/clothing-erp/maintenance) { return 503; }

    root /home/frappe/frappe-bench/sites;
    client_max_body_size 50m;
    proxy_read_timeout 120s;

    # Static Assets (Public)
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Strict isolation: Block direct web access to protected and private directories
    location /protected/ { return 404; }
    location ^~ /private/ { return 404; }

    # Socket.IO Realtime Gateway
    location /socket.io {
        proxy_pass http://clothing_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin https://$http_host;
        proxy_set_header X-Frappe-Site-Name clothing.local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # Primary Frappe Application Gateway
    location / {
        proxy_pass http://clothing_web;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name clothing.local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
