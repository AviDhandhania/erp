[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse_erp"
version = "1.0.0"
description = "Warehouse ERP for fulfillment scanning, pick lists, dispatch, and inventory movements"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["warehouse_erp*"]
