name: Mobile CI (Sales, Warehouse, Quality)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  mobile-security-and-sbom:
    name: Mobile Security Scan & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0a5c327461c147115300ce63d414d6bbc0f1758a # v5.0.0
        with:
          python-version: '3.11'

      - name: Run Mobile Security Scanner
        run: |
          python mobile/scripts/scan_mobile_dependencies.py

      - name: Generate Mobile SBOM (CycloneDX and SPDX)
        run: |
          python mobile/scripts/generate_mobile_sbom.py

      - name: Upload Mobile SBOM Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mobile-sbom
          path: mobile/sbom/

  mobile-analysis-and-test:
    name: Flutter Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Verify Workspace Structure
        run: |
          flutter --version
          cd mobile
          test -f melos.yaml
          test -f pubspec.yaml

  build-unsigned-android:
    name: Build Unsigned Android APKs (PR & CI)
    runs-on: ubuntu-latest
    needs: [mobile-security-and-sbom, mobile-analysis-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@8df1039502657977a6b688d9dca3dd091fa820a9 # v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          flutter-version: '3.24.5'

      - name: Verify Separate Bundle IDs
        run: |
          grep 'com.clothingerp.sales' mobile/apps/sales_app/android/app/build.gradle
          grep 'com.clothingerp.warehouse' mobile/apps/warehouse_app/android/app/build.gradle
          grep 'com.clothingerp.quality' mobile/apps/quality_app/android/app/build.gradle
